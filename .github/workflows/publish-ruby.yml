name: Publish — Ruby SDK

on:
  push:
    tags:
      - 'ruby/v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
      - name: Build gem
        run: gem build huntrecht-sdk.gemspec
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ruby SDK ${{ github.ref_name }}
          generate_release_notes: true
          files: ruby/*.gem
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
        run: |
          : "${GEM_HOST_API_KEY:?GEM_HOST_API_KEY must be set}"
          gem push huntrecht-sdk-*.gem
